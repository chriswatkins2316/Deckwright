name: Update MTG news

# Refreshes news.json (the headlines on Deckwright's News tab) from Daily MTG every morning.
on:
  schedule:
    - cron: "41 11 * * *"   # daily, early morning US time
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: write
  pages: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Headlines from magic.wizards.com
        run: python3 build_news.py news.json

      - name: Save them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "No new articles"; exit 0; fi
          git commit -m "Update MTG news"
          git push

      - name: Republish the site
        continue-on-error: true
        run: |
          curl -fsSL -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages/builds
